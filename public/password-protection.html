<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SHOGI Systems | Investor Access</title>
  <style>
    :root{--navy:#061b32;--teal:#10bdb2;--ink:#09131f}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#04111f,#092747);color:#fff;font-family:Inter,Arial,sans-serif}
    main{width:min(440px,100%);padding:42px 38px;border:1px solid rgba(255,255,255,.18);background:rgba(6,27,50,.9);box-shadow:0 24px 70px rgba(0,0,0,.25)}
    .wordmark{margin:0 0 42px;color:var(--teal);font-size:.82rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(2rem,7vw,3rem);line-height:1.04;letter-spacing:-.05em}
    p{color:#c6d8e8;line-height:1.55}
    label{display:block;margin:28px 0 8px;font-size:.82rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    input{width:100%;padding:14px;border:1px solid rgba(255,255,255,.35);border-radius:0;background:#fff;color:var(--ink);font:inherit}
    button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:0;background:var(--teal);color:#031521;font:inherit;font-weight:900;cursor:pointer}
    .error{margin:16px 0 0;color:#ffcf76;font-size:.92rem}
  </style>
</head>
<body>
  <main>
    <p class="wordmark">SHOGI Systems, Inc.</p>
    <h1>Investor access</h1>
    <p>Enter the password provided by SHOGI to view the seed-round materials.</p>
    <form method="post" action="/access">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Continue</button>
    </form>
    <p class="error" id="error" hidden>That password was not recognized. Please try again.</p>
  </main>
  <script>
    if (new URLSearchParams(location.search).get('error') === '1') {
      document.getElementById('error').hidden = false;
    }
  </script>
</body>
</html>
